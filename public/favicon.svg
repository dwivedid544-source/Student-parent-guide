<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular Forest Green Container -->
  <circle cx="32" cy="32" r="30" fill="#194333"/>
  
  <!-- Subtle Translucent Orbital Ring -->
  <ellipse cx="32" cy="32" rx="20" ry="8" stroke="#DCE8DE" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.5" transform="rotate(-25 32 32)"/>
  
  <!-- Central Compass Star / Needle -->
  <polygon points="32,14 35.5,28.5 50,32 35.5,35.5 32,50 28.5,35.5 14,32 28.5,28.5" fill="#DCE8DE"/>
  
  <!-- Inner Contrast Core -->
  <polygon points="32,20 34,29.5 44,32 34,34.5 32,44 30,34.5 20,32 30,29.5" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="2.5" fill="#194333"/>
</svg>

